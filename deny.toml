# cargo-deny configuration
# See: https://embarkstudios.github.io/cargo-deny/

[advisories]
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSL-1.0",
    "MPL-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"
# Reviewed 2026-09-10: serialport 4.10.1 still requires these incompatible
# platform API versions. Remove each exception when serialport updates it.
# These exceptions affect duplicate detection only, never advisory checks.
skip = [
    { crate = "bitflags@1.3.2", reason = "Required by serialport 4.10.1 -> nix 0.26.4; other dependencies use bitflags 2." },
    { crate = "nix@0.26.4", reason = "Required by serialport 4.10.1; rustyline 18 uses nix 0.31." },
    { crate = "windows-sys@0.52.0", reason = "Required by serialport 4.10.1; other dependencies use windows-sys 0.61." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
